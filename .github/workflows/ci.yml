name: test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e .[test]
      - run: python -m unittest discover -s tests -v
        env:
          KR_B2A_APP_ROOT: ${{ runner.temp }}/kr-b2a-tests
