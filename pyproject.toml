[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-book-to-audio"
version = "1.3.0"
description = "A robust multilingual book-to-audiobook pipeline with OCR advisor, provider registries and durable resume."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["edge-tts>=7.0"]

[project.optional-dependencies]
dev = []
ocr-paddle = ["paddleocr>=3.0"]

[project.scripts]
kr-book-to-audio = "kr_book_to_audio.cli:main"
kr-book-to-audio-gui = "kr_book_to_audio.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
